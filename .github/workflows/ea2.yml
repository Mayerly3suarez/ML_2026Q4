name: EA2 - Flujo de modelos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ea2-main
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Limpiar datos y reportes generados
        run: |
          rm -rf src/Actividades_Evaluativas/datos src/Actividades_Evaluativas/reportes

      - name: Ejecutar el notebook de la EA1
        run: |
          jupyter nbconvert --to notebook --execute --inplace src/Actividades_Evaluativas/EA1_carga_datos.ipynb

      - name: Ejecutar el notebook de la EA2
        run: |
          jupyter nbconvert --to notebook --execute --inplace src/Actividades_Evaluativas/EA2_modelos.ipynb

      - name: Publicar el resumen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resumen-modelos
          path: |
            src/Actividades_Evaluativas/reportes/
            src/Actividades_Evaluativas/EA1_carga_datos.ipynb
            src/Actividades_Evaluativas/EA2_modelos.ipynb

      - name: Confirmar resultados generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Actividades_Evaluativas/

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de las actividades EA1 y EA2 [skip ci]"
          git push origin HEAD:main