name: Actividades evaluativas - Flujo completo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actividades-main
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Limpiar datos, reportes, gráficas y modelos generados
        run: |
          cd src/Actividades_Evaluativas
          rm -rf datos reportes graficas modelos

      - name: Ejecutar el notebook de la EA1
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            src/Actividades_Evaluativas/EA1_carga_datos.ipynb

      - name: Ejecutar el notebook de la EA2
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            src/Actividades_Evaluativas/EA2_modelos.ipynb

      - name: Ejecutar el notebook de la EA3
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            src/Actividades_Evaluativas/EA3_modelo.ipynb

      - name: Publicar resúmenes y gráficas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resumen-actividades
          path: |
            src/Actividades_Evaluativas/reportes/
            src/Actividades_Evaluativas/graficas/
            src/Actividades_Evaluativas/EA1_carga_datos.ipynb
            src/Actividades_Evaluativas/EA2_modelos.ipynb
            src/Actividades_Evaluativas/EA3_modelo.ipynb

      - name: Confirmar resultados generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd src/Actividades_Evaluativas
          git add datos reportes graficas \
            EA1_carga_datos.ipynb EA2_modelos.ipynb EA3_modelo.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de las actividades EA1, EA2 y EA3 [skip ci]"
          git push origin HEAD:main
